# Gitleaks configuration file for DevSecOps Secret Scanning
title = "DevSecOps Secret Scanning Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for false positives or documentation"
paths = [
  '''^\.git/''',
  '''^reports/''',
  '''^test-docker/WhatsApp Image.*''',
  '''\.md$'''
]
regexes = [
  '''example-secret-key''',
  '''test-token'''
]
