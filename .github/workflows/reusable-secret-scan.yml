name: "Reusable Secret Scanning"

on:
  workflow_call:
    inputs:
      scan-path:
        description: "Path to scan for secrets"
        type: string
        default: "."
        required: false
      fail-on-findings:
        description: "Whether to fail the job if secrets are detected"
        type: boolean
        default: false
        required: false
      upload-sarif:
        description: "Whether to upload SARIF report to GitHub Code Scanning"
        type: boolean
        default: true
        required: false

jobs:
  secret-scan:
    name: "Secret Scanning (Gitleaks & Git-Secret)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Gitleaks"
        run: |
          GITLEAKS_VERSION="8.18.4"
          echo "Installing Gitleaks v${GITLEAKS_VERSION}..."
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: "Run Gitleaks Secret Scanner"
        id: gitleaks_scan
        shell: bash
        run: |
          mkdir -p reports
          EXIT_CODE=0
          gitleaks detect \
            --source="${{ inputs.scan-path }}" \
            --verbose \
            --report-format=sarif \
            --report-path=reports/gitleaks.sarif || EXIT_CODE=$?

          # Also produce JSON for Central Vulnerability Management
          gitleaks detect \
            --source="${{ inputs.scan-path }}" \
            --report-format=json \
            --report-path=reports/gitleaks.json || true

          echo "Gitleaks finished with exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Secrets detected by Gitleaks!"
            if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
              exit $EXIT_CODE
            fi
          else
            echo "No secrets detected."
          fi

      - name: "Upload SARIF to GitHub Code Scanning"
        if: ${{ inputs.upload-sarif && !cancelled() && hashFiles('reports/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks-secret-scanning

      - name: "Upload Secret Scan Artifacts"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: reports/gitleaks.*
          retention-days: 14

      - name: "Generate Step Summary"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "### 🔒 Secret Scanning (Gitleaks / git-secret)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Path**: \`${{ inputs.scan-path }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/gitleaks.json ]; then
            FINDINGS_COUNT=$(jq '. | length' reports/gitleaks.json 2>/dev/null || echo "0")
            echo "- **Findings Detected**: \`$FINDINGS_COUNT\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$FINDINGS_COUNT" -gt 0 ]; then
              echo "⚠️ Potential leaked credentials found. Inspect the artifact or GitHub Security alerts." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "✅ No leaked secrets detected." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
