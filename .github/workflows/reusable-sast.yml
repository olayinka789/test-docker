name: "Reusable SAST Scanning"

on:
  workflow_call:
    inputs:
      scan-path:
        description: "Path to source code to scan"
        type: string
        default: "."
        required: false
      semgrep-rules:
        description: "Semgrep rulesets to execute"
        type: string
        default: "p/default p/security-audit p/owasp-top-ten"
        required: false
      enable-sonar:
        description: "Enable SonarQube/SonarCloud scan if credentials provided"
        type: boolean
        default: false
        required: false
      fail-on-findings:
        description: "Fail the job if security vulnerabilities are found"
        type: boolean
        default: false
        required: false
    secrets:
      SONAR_TOKEN:
        required: false
        description: "SonarCloud or SonarQube authentication token"
      SONAR_HOST_URL:
        required: false
        description: "SonarQube server URL (optional for SonarCloud)"

jobs:
  sast:
    name: "SAST (Semgrep & SonarQube)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python for Semgrep"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Semgrep"
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep --version

      - name: "Run Semgrep SAST Scanner"
        id: semgrep_scan
        shell: bash
        run: |
          mkdir -p reports
          EXIT_CODE=0
          CONFIG_ARGS=""
          for rule in ${{ inputs.semgrep-rules }}; do
            CONFIG_ARGS="$CONFIG_ARGS --config $rule"
          done

          semgrep scan $CONFIG_ARGS \
            --sarif \
            --output reports/semgrep.sarif \
            "${{ inputs.scan-path }}" || EXIT_CODE=$?

          semgrep scan $CONFIG_ARGS \
            --json \
            --output reports/semgrep.json \
            "${{ inputs.scan-path }}" || true

          echo "Semgrep finished with exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ] && [ "${{ inputs.fail-on-findings }}" = "true" ]; then
            exit $EXIT_CODE
          fi

      - name: "Run SonarQube / SonarCloud Scanner (Optional)"
        if: ${{ inputs.enable-sonar && secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: "Upload SARIF to GitHub Code Scanning"
        if: ${{ !cancelled() && hashFiles('reports/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep-sast

      - name: "Upload SAST Scan Artifacts"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/semgrep.*
          retention-days: 14

      - name: "Generate Step Summary"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "### 🛡️ SAST (Static Application Security Testing)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scanner**: Semgrep & SonarQube" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rulesets**: \`${{ inputs.semgrep-rules }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/semgrep.json ]; then
            FINDINGS_COUNT=$(jq '.results | length' reports/semgrep.json 2>/dev/null || echo "0")
            echo "- **Findings Detected**: \`$FINDINGS_COUNT\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$FINDINGS_COUNT" -gt 0 ]; then
              echo "⚠️ SAST findings identified. Review \`reports/semgrep.sarif\` or GitHub Code Scanning." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "✅ No SAST security violations detected." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
