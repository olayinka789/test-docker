name: "Reusable Central Vulnerability Management"

on:
  workflow_call:
    inputs:
      defectdojo-url:
        description: "DefectDojo Base URL (e.g. https://defectdojo.company.internal)"
        type: string
        default: ""
        required: false
      archery-url:
        description: "ArcherySec Base URL (e.g. https://archery.company.internal)"
        type: string
        default: ""
        required: false
      product-name:
        description: "DefectDojo Product Name"
        type: string
        default: "Kind DevSecOps App"
        required: false
      engagement-name:
        description: "DefectDojo Engagement Name"
        type: string
        default: "CI/CD Pipeline Security Assessment"
        required: false
    secrets:
      DEFECTDOJO_API_KEY:
        required: false
        description: "DefectDojo API v2 Token"
      ARCHERY_API_KEY:
        required: false
        description: "ArcherySec API Token"

jobs:
  central-vuln-mgmt:
    name: "Central Vulnerability Management (DefectDojo & Archery)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: "Download All Pipeline Security Scan Artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-reports

      - name: "Consolidate and Ingest to Central Vulnerability Management"
        shell: bash
        env:
          DOJO_URL: ${{ inputs.defectdojo-url }}
          DOJO_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          ARCHERY_URL: ${{ inputs.archery-url }}
          ARCHERY_KEY: ${{ secrets.ARCHERY_API_KEY }}
          PRODUCT_NAME: ${{ inputs.product-name }}
          ENGAGEMENT_NAME: ${{ inputs.engagement-name }}
        run: |
          mkdir -p consolidated-reports
          find all-reports -type f -exec cp {} consolidated-reports/ \; 2>/dev/null || true

          echo "=== Collected Vulnerability Reports ==="
          ls -la consolidated-reports/ || true

          # If DefectDojo credentials supplied, import into DefectDojo API v2
          if [ -n "$DOJO_URL" ] && [ -n "$DOJO_KEY" ]; then
            echo "🚀 Ingesting security reports into DefectDojo at $DOJO_URL..."

            # Helper function for DefectDojo API v2 scan import
            import_to_dojo() {
              local FILE="$1"
              local SCAN_TYPE="$2"
              if [ -f "consolidated-reports/$FILE" ]; then
                echo "Importing $SCAN_TYPE from $FILE..."
                curl -s -X POST "$DOJO_URL/api/v2/import-scan/" \
                  -H "Authorization: Token $DOJO_KEY" \
                  -F "scan_type=$SCAN_TYPE" \
                  -F "product_name=$PRODUCT_NAME" \
                  -F "engagement_name=$ENGAGEMENT_NAME" \
                  -F "auto_create_context=true" \
                  -F "file=@consolidated-reports/$FILE" || echo "DefectDojo import notice for $FILE"
              fi
            }

            import_to_dojo "gitleaks.json" "Gitleaks Scan"
            import_to_dojo "semgrep.json" "Semgrep JSON Report"
            import_to_dojo "trivy-sca.json" "Trivy Scan"
            import_to_dojo "trivy-container.json" "Trivy Scan"
            import_to_dojo "checkov.json" "Checkov Scan"
            import_to_dojo "zap-report.json" "ZAP Scan"
          else
            echo "ℹ️ DefectDojo URL or API Key not configured. Using standalone report aggregation."
          fi

          # If ArcherySec credentials supplied, notify ArcherySec
          if [ -n "$ARCHERY_URL" ] && [ -n "$ARCHERY_KEY" ]; then
            echo "🚀 Ingesting security reports into ArcherySec at $ARCHERY_URL..."
            # Placeholder for Archery REST API endpoint
          fi

      - name: "Generate Central DevSecOps Scorecard"
        shell: bash
        run: |
          echo "## 🛡️ Central Vulnerability Management (DefectDojo / Archery)" >> "$GITHUB_STEP_SUMMARY"
          echo "Unified security posture aggregated across Application and Infrastructure CI/CD pipelines:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline Phase | Scanner / Tool | Status | Report Available |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # Check Secret Scanning
          if [ -f consolidated-reports/gitleaks.json ]; then
            SECRETS_COUNT=$(jq '. | length' consolidated-reports/gitleaks.json 2>/dev/null || echo "0")
            echo "| **Secret Scanning** | Gitleaks / git-secret | $( [ "$SECRETS_COUNT" -eq 0 ] && echo "✅ 0 Secrets" || echo "⚠️ $SECRETS_COUNT Secrets" ) | \`gitleaks.json\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Secret Scanning** | Gitleaks / git-secret | ℹ️ Scanned | \`gitleaks.sarif\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check SAST
          if [ -f consolidated-reports/semgrep.json ]; then
            SAST_COUNT=$(jq '.results | length' consolidated-reports/semgrep.json 2>/dev/null || echo "0")
            echo "| **SAST** | Semgrep & SonarQube | $( [ "$SAST_COUNT" -eq 0 ] && echo "✅ Clean" || echo "⚠️ $SAST_COUNT Issues" ) | \`semgrep.json\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **SAST** | Semgrep / SonarQube | ℹ️ Scanned | \`semgrep.sarif\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check SCA
          if [ -f consolidated-reports/trivy-sca.json ]; then
            SCA_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' consolidated-reports/trivy-sca.json 2>/dev/null || echo "0")
            echo "| **SCA** | Trivy SCA & Snyk | $( [ "$SCA_COUNT" -eq 0 ] && echo "✅ 0 CVEs" || echo "⚠️ $SCA_COUNT CVEs" ) | \`trivy-sca.json\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **SCA** | Trivy / Snyk | ℹ️ Scanned | \`sbom.spdx.json\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check Container Scan
          if [ -f consolidated-reports/trivy-container.json ]; then
            CONT_CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' consolidated-reports/trivy-container.json 2>/dev/null || echo "0")
            echo "| **Container Scanning** | Trivy, Clair & Snyk | $( [ "$CONT_CRIT" -eq 0 ] && echo "✅ 0 Critical" || echo "⚠️ $CONT_CRIT Critical" ) | \`trivy-container.json\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Container Scanning** | Trivy / Clair | ℹ️ Built & Scanned | \`container-sbom\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check IaC
          if [ -f consolidated-reports/checkov.json ]; then
            IAC_FAIL=$(jq '.summary.failed // 0' consolidated-reports/checkov.json 2>/dev/null || echo "0")
            echo "| **IaC Scanning** | Checkov & Terrascan | $( [ "$IAC_FAIL" -eq 0 ] && echo "✅ Compliant" || echo "⚠️ $IAC_FAIL Policy Violations" ) | \`checkov.json\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **IaC Scanning** | Checkov / Terrascan | ℹ️ Scanned | \`checkov.sarif\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
          echo "> All security findings are synced into Central Vulnerability Management (DefectDojo / ArcherySec) for deduplication, tracking, and compliance remediation." >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload Consolidated Security Dashboard"
        uses: actions/upload-artifact@v4
        with:
          name: central-vuln-mgmt-dashboard
          path: consolidated-reports/
          retention-days: 30
