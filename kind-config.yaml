# Save as kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Map port 443 for ArgoCD HTTPS access with NodePort
  - containerPort: 30443
    hostPort: 8443
    protocol: TCP
  # Map ports for ingress-nginx (optional)
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 9443
    protocol: TCP
